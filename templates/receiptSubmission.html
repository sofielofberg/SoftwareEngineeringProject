<!DOCTYPE html>
<html>
    <head>
        <title>Receipt</title>
        <link rel="stylesheet" href="/static/receiptSubmission.css">
        <script src="/static/attempt.js"></script>
    </head>
    <body>
        <a href="{{ url_for('select') }}">
            <button>
                Go Back
            </button>
        </a>
        <form method="POST" enctype="multipart/form-data">
            <p>
                You are currently logged in as: {{ user.username }}
            </p>
            <a href="{{ url_for('logout') }}">
                <button type="button" class="placeholder space">
                    log out
                </button>
            </a>
            <fieldset>
                <legend>Receipt Creation</legend> <!-- title in the box of it -->
                <label class="space">
                    Upload image of receipt
                    <input name="image" type="file" accept="image/*" required oninput="KeepReceiptPopUp()">
                </label>
                <label class="space">
                    Amount spent:
                    <input name="amount" type="number" step="0.01" required>
                </label>
                <label class="space">
                    Date:
                    <input name="date" type="datetime-local" required>
                </label>
                <label class="space">
                    Bank statement id:
                    <input name="bank_stmt_id" type="number" required>
                </label>
                <button type="submit" class="placeholder">
                    Submit!
                </button>
            </fieldset>
        </form>
    </body>
</html>

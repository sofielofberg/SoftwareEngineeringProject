<!DOCTYPE html>
<html>
    <head>
        <title>
            ReceiptSelector
        </title>
        <link rel="stylesheet" href="/static/receiptSelect.css">
    </head>
    <body>
        <form>
            <p>
                You are currently logged in as: USERNAME
            </p>
            <button class="placeholder space">
                log out
            </button>
            <fieldset>
                <legend>Receipt Selection</legend> <!-- title in the box of it -->
                <label class="space">
                    Filter:
                    <select>
                        <option value="one">
                            All
                        </option>
                        <option value="two">
                            Handled
                        </option>
                        <option value="three">
                            Approved
                        </option>
                        <option value="four">
                            Denied
                        </option>
                    </select>
                </label>
                <button class="space">
                    search
                </button>
                <div class="scroll">
                    <div class="receiptDisplay">
                        <p class="rDate">
                            date of receipt
                        </p>
                        <p class="rSub">
                            submitter
                        </p>
                        <p class="rStatus">
                            status
                        </p>
                    </div>
                </div>
            </fieldset>
        </form>
    </body>
</html>
